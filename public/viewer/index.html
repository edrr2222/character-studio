<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tu personaje</title>
<style>
  body{margin:0;background:#12151b;color:#e7ecf3;font-family:system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:24px;gap:14px;}
  select,button{background:#1c2028;color:#e7ecf3;border:1px solid #2a2f3a;border-radius:6px;
       padding:8px 12px;font-size:14px;}
  button{cursor:pointer;background:#6ee7c7;color:#0d1410;font-weight:600;border:none;}
  #stage{background:#1c2028;border:1px solid #2a2f3a;border-radius:10px;}
  .hint{font-size:12px;color:#8a93a3;}
</style>
</head>
<body>
  <h2>Tu personaje</h2>
  <div>
    <select id="categorySelect"></select>
    <button id="btnNew">🎲 Nuevo personaje</button>
  </div>
  <canvas id="stage" width="500" height="500"></canvas>
  <p class="hint">Muévelo con <b>WASD</b>. Se anima según lo que hace (quieto / caminando).</p>

  <script src="/shared/engine.js"></script>
  <script src="main.js"></script>
</body>
</html>
